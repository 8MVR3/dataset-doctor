[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-doctor"
version = "0.1.0"
description = "Проверка датасетов в формате YOLO перед обучением: ошибки разметки, дубли, утечки между выборками"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["Pillow>=9", "PyYAML>=6"]

[project.scripts]
dataset-doctor = "dataset_doctor.cli:main"

[tool.setuptools]
packages = ["dataset_doctor"]
